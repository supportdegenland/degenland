<style>
.ac-lang{display:flex;gap:6px}
.ac-lang button{font:600 13px "Chakra Petch",system-ui,sans-serif;background:transparent;color:var(--text);border:2px solid var(--edge);padding:5px 9px;cursor:pointer}
.ac-lang button[aria-pressed="true"]{background:var(--cyan);color:var(--ink);border-color:var(--cyan)}
.ac-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:24px;align-items:start;margin-top:8px}
.ac-side{position:sticky;top:84px;display:grid;gap:16px}
.card h2{font-size:20px;margin:0 0 12px}
.fld{display:block;margin:0 0 16px}
.fld > span{display:block;font-weight:700;margin-bottom:6px}
.fld small{display:block;color:var(--muted);font-size:13px;margin-top:5px}
.fld input[type=text],.fld input[type=url],.fld input:not([type]){width:100%;font:500 16px "Chakra Petch",system-ui,sans-serif;padding:10px 12px;background:var(--bg1);color:var(--text);border:2px solid var(--edge)}
.fld input:focus-visible{outline:3px solid var(--cyan);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;width:1px;height:1px}
.chips span{display:inline-block;min-width:64px;text-align:center;font-weight:700;padding:8px 14px;border:2px solid var(--edge);background:var(--panel);cursor:pointer}
.chips input:checked + span{background:var(--sun);color:var(--ink);border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.chips input:focus-visible + span{outline:3px solid var(--cyan);outline-offset:2px}
fieldset{border:0;margin:0 0 16px;padding:0}
legend{font-weight:700;margin-bottom:6px;padding:0}
.tot{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-top:2px solid var(--edge);padding-top:12px;margin-top:4px}
.tot b{font-size:24px;font-variant-numeric:tabular-nums}
.tot span{color:var(--muted);font-size:14px;text-align:right}
.chk{display:flex;gap:10px;align-items:flex-start;margin:14px 0}
.chk input{margin-top:4px;width:18px;height:18px;flex:none}
.err{color:#ff5a7a;font-weight:700;min-height:1.2em;margin:8px 0 0}
.who{padding:10px 12px;border:2px dashed var(--edge);margin:0 0 16px}
/* anteprima: stessa forma dell'annuncio nel gioco */
.pv{background:var(--panel2);border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:18px;text-align:center}
.pv .lab{font-size:13px;color:var(--muted);margin:0 0 10px}
.pv .art{height:96px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--cyan));border:2px solid var(--ink);margin-bottom:12px;font-family:"Press Start 2P",monospace;font-size:22px;color:var(--ink)}
.pv h3{margin:0 0 4px;font-size:18px;word-break:break-word}
.pv p{margin:0 0 6px;color:var(--muted);word-break:break-word}
.pv .host{font-size:13px}
.pv .go{display:inline-block;margin-top:8px;background:var(--cyan);color:var(--ink);font-weight:700;padding:8px 14px;border:2px solid var(--ink)}
.pv .cd{font-size:14px;color:var(--muted);margin-top:10px}
.advt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.advt th,.advt td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--edge)}
.advt th:first-child,.advt td:first-child{text-align:left}
.advt thead th{font-size:13px;color:var(--muted);font-weight:600}
.pay{display:grid;gap:12px}
.pay .row2{display:flex;gap:8px}
.pay input{flex:1;min-width:0;font:600 15px "Chakra Petch",system-ui,sans-serif;padding:10px 12px;background:var(--bg1);color:var(--text);border:2px solid var(--edge)}
.big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:14px;background:var(--bg1);border:2px solid var(--ink)}
.bar i{display:block;height:100%;background:var(--mint)}
.st{display:inline-block;font-weight:700;padding:3px 10px;border:2px solid var(--ink);background:var(--sun);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--mint);color:var(--ink);font-weight:700;padding:10px 16px;border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink);opacity:0;pointer-events:none;transition:opacity .15s}
.toast.show{opacity:1}
@media (max-width:900px){.ac-grid{grid-template-columns:1fr}.ac-side{position:static}}
</style>

<header class="top"><div class="wrap">
  <a class="logo" id="hHome" href="en/index.html">DegenLand</a>
  <nav class="links" aria-label="Home"><a id="nHome" href="en/index.html">Home</a><a id="nFaq" href="en/faq.html">FAQ</a><a id="nTerms" href="en/terms.html">Terms</a></nav>

  <a class="btn" id="hPlay" href="game/index.html">Play</a>
</div></header>
<main>
<div class="wrap page">
  <h1>Advertise Center</h1>
  <p class="lead" id="lead"></p>

  <!-- stato di una campagna (link con ?c=ID&k=CHIAVE) -->
  <section id="statusView" hidden></section>

  <div id="mainView">
    <section class="band" style="padding:6px 0 18px"><h2 class="sec" id="howT" style="margin-top:0"></h2><div class="steps" id="steps"></div></section>

    <div class="ac-grid">
      <div>
        <form class="card" id="form" novalidate>
          <h2 id="fT"></h2>
          <label class="fld"><span id="lTitle"></span><input id="title" maxlength="40" autocomplete="off" required><small id="hTitle"></small></label>
          <label class="fld"><span id="lDescr"></span><input id="descr" maxlength="90" autocomplete="off"><small id="hDescr"></small></label>
          <label class="fld"><span id="lUrl"></span><input id="url" type="url" inputmode="url" placeholder="https://" autocomplete="url" required></label>
          <fieldset><legend id="lViews"></legend><div class="chips" id="views"></div></fieldset>
          <fieldset><legend id="lSec"></legend><div class="chips" id="secs"></div><small id="hSec" style="display:block;color:var(--muted);font-size:13px;margin-top:6px"></small></fieldset>
          <fieldset><legend id="lPay"></legend><div class="chips" id="method"></div></fieldset>
          <div id="solFields">
            <label class="fld"><span id="lContact"></span><input id="contact" maxlength="120" autocomplete="email"><small id="hContact"></small></label>
            <label class="fld"><span id="lWallet"></span><input id="wallet" maxlength="64" autocomplete="off" spellcheck="false"><small id="hWallet"></small></label>
          </div>
          <div id="tokFields" hidden><div class="who" id="who"></div>
            <label class="fld"><span id="lContact2"></span><input id="contact2" maxlength="120" autocomplete="email"></label>
          </div>
          <div class="tot"><b id="total">–</b><span id="totalAlt"></span></div>
          <div id="ts" style="margin-top:14px"></div>
          <label class="chk"><input type="checkbox" id="agree"><span id="lAgree"></span></label>
          <button class="btn big" type="submit" id="send" style="width:100%"></button>
          <p class="err" id="err" role="alert"></p>
        </form>
        <section class="card" id="done" hidden></section>
      </div>
      <aside class="ac-side">
        <div><p style="margin:0 0 8px;font-weight:700" id="pvT"></p>
          <div class="pv" aria-live="polite"><p class="lab" id="pvLab">Sponsor</p><div class="art" id="pvArt">AD</div><h3 id="pvTitle"></h3><p id="pvDescr"></p><p class="host" id="pvHost"></p><span class="go" id="pvGo"></span><p class="cd" id="pvCd"></p></div>
        </div>
        <div class="card"><h2 id="priceT"></h2><table class="advt" id="prices"></table><p class="disc" id="priceNote" style="margin:12px 0 0"></p></div>
      </aside>
    </div>
  </div>
</div>
</main>

  var LOC = {en:'en-US',es:'es-ES',it:'it-IT',ru:'ru-RU'}, L = ['en','es','ru','it'];

        '<div><p style="margin:0 0 6px;font-weight:700">'+esc(x.addr)+'</p><div class="row2"><input readonly value="'+esc(j.address)+'" aria-label="'+esc(x.addr)+'"><button class="btn" type="button" data-c="'+esc(j.address)+'">'+esc(x.copy)+'</button></div></div>' +
        '<div class="row2"><button class="btn ghost" type="button" data-c="'+esc(j.sol)+'">'+esc(x.copy)+' SOL</button><a class="btn ghost" href="'+esc(j.uri)+'">'+esc(x.openW)+'</a></div><p style="margin:0">'+esc(x.dSolN)+'</p></div>';
    } else {
      h = '<h2>'+esc(fill(x.dTokT, {id:j.id}))+'</h2><p>'+esc(fill(x.dTokP, {t: num(j.tokens)}))+'</p>';
    }
    h += '<h3 style="margin-top:22px">'+esc(x.track)+'</h3><div class="pay"><div class="row2"><input readonly value="'+esc(link)+'"><button class="btn" type="button" data-c="'+esc(link)+'">'+esc(x.copy)+'</button></div><p class="disc" style="margin:0">'+esc(x.trackN)+'</p><p style="margin:0"><a href="'+esc(link)+'">'+esc(x.track)+'</a> · <a href="?lang='+lang+'">'+esc(x.another)+'</a></p></div>';

  }

      var x = t(); if(!j.ok){ box.innerHTML = '<div class="card"><p>'+esc(x.stNotFound)+'</p></div>'; return; }
      var c = j.campaign, pct = c.views_total ? Math.min(100, Math.round(c.views_done / c.views_total * 100)) : 0;

        '<p style="margin:14px 0 6px;font-weight:700">'+esc(fill(x.stViews, {d: num(c.views_done), t: num(c.views_total)}))+'</p><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div>' +
